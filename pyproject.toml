[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "onshape-backup"
version = "0.1.0"
description = "Export an Onshape assembly, BOM, and selected printable parts"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["requests>=2.32,<3"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
onshape-export = "onshape_export.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
